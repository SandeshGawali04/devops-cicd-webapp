<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Project Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #1e293b;
            text-align: center;
            padding: 60px 20px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px #cbd5e1;
        }
        h1 { color: #2563eb; }
        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps Project Dashboard</h1>
        <p>CI/CD Pipeline for a Web Application</p>
        <p class="status">Application Running Successfully</p>
        <h3>Our DevOps Tools</h3>
        <p>GitHub | GitHub Actions | Docker</p>
        <p>This application demonstrates automated build,
        testing, and containerization.</p>
    </div>
</body>
</html>
